name: quality-gates

# The practices audited in phase 2 (issues #157/#158/#159/#164) plus the
# citability policy, enforced on every PR and on main (issue #192).
#
# #515: the same gates, on four runners instead of one. Measured on two
# ordinary PRs, a green run took ~670 s and two of the twenty-four steps were
# 70 % of it — accessibility (262 s) and Lighthouse (202 s) — neither of which
# needs the other to have finished. They need the same thing: a built site and
# a booted stack, which together cost 20 s. So the saving is concurrency, not
# exclusion; #497 had already taken the exclusion that was safe to take.
#
# The repository is public, so runners are free and four cost what one costs.
# Each rendered-output job rebuilds and reboots rather than passing `dist/`
# between jobs: the build is 20 s, an artifact round trip is not obviously
# less, and #399 is what a full artifact quota does to an unrelated gate.
#
# Two things this split could quietly break, both guarded:
#   * The gate count on /deconstruyendo. `Build` and `Boot seeded local stack`
#     now appear on three runners. tests/unit/gate-count.test.ts counts
#     DISTINCT gate names, which is also what the sentence on the page means:
#     a gate run on three runners is one gate.
#   * The stack probe (#390). Three jobs boot a stack, so all three keep the
#     probe, and the Lighthouse liveness diagnostic follows Lighthouse into
#     `perf` and runs per matrix shard.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # gitleaks-action lists the PR's commits

jobs:
  # The scope decision is its own job because five jobs need its answer and the
  # issue's rule is that no worker waits for another worker. It is checkout plus
  # one bash script — the cheapest thing that can hold an output.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      site: ${{ steps.scope.outputs.site }}
      lighthouse_urls: ${{ steps.lighthouse_urls.outputs.urls }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # ci-scope.sh diffs base...head

      - name: Scope — does this change reach the rendered site?  # not-a-gate: fails open, never refuses a change
        id: scope
        # Not "skip CI for docs". The three steps BELOW that read file content
        # rather than a rendered page — gitleaks, citability and the CSS source
        # budget — are deliberately NOT gated on this, because a document is a
        # file: it can carry a secret, a client name, or the budget figure the
        # budget gate exists to check (#475). A plain `paths-ignore: docs/**`
        # would switch that last one off exactly when it matters (#497).
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci-scope.sh

      - name: Lighthouse URLs, read from lighthouserc.json  # not-a-gate: publishes the matrix, asserts nothing
        id: lighthouse_urls
        # The `perf` matrix shards over these, so the list stays in ONE place:
        # the config that also holds the assertions. Hardcoding the five URLs
        # in a matrix here is how a URL gets added to the config and measured
        # by nothing.
        run: |
          urls=$(jq -c '.ci.collect.url' lighthouserc.json)
          echo "$urls" | jq -e 'length > 0' > /dev/null
          echo "urls=$urls" >> "$GITHUB_OUTPUT"
          echo "  Lighthouse shards: $(echo "$urls" | jq -r 'length')"

  # ── static: everything that reads files, never a rendered page ────────────
  static:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans history of the push range

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `cache: npm` above caches ~/.npm — the tarballs npm DOWNLOADS. It does
      # not cache node_modules, and `npm ci` deletes node_modules by design and
      # rebuilds it: 823 packages extracted, linked, and their install scripts
      # run. Measured 2026-09-04 on a cache that HIT — 257 MB restored at
      # 74 MB/s, then `added 823 packages in 7m`. The cache removed the
      # download and none of the work, in all eight jobs of the run.
      #
      # `~/.cache/puppeteer` rides along because it is the same function of the
      # same lockfile: puppeteer carries `"hasInstallScript": true`, so the
      # browser every browser-driven gate shares is fetched by `npm ci` — eight
      # times a run since #515 split one job into eight.
      #
      # NO `restore-keys`, deliberately. A near-miss restore from a different
      # lockfile is the hazard this whole step introduces: a node_modules that
      # is present but wrong fails inside a gate, and reads like a code fault.
      # Exact match or full install, nothing in between (#526).
      - name: Restore node_modules and the browser  # not-a-gate: a cache lookup, not a check
        id: deps
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            ~/.cache/puppeteer
          key: deps-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install  # not-a-gate: dependency install, not a check
        if: needs.scope.outputs.site == 'true' && steps.deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The gate is the scan's exit code, never the upload. Observed on PR
          # #397: "1 commits scanned / no leaks found", then the step died in
          # CreateArtifact because the artifact quota was full (#399) — a red
          # secret scan on a clean tree, which is the one lie a security gate
          # must never tell. Nothing consumed those 236 SARIFs: they were never
          # fed to code scanning, and no one downloaded one.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: Citability guard
        env:
          FORBIDDEN_NAMES: ${{ secrets.FORBIDDEN_NAMES }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        # Scans the TRACKED tree for non-citable names, proves it can find
        # one before trusting a clean result, refuses outright if the secret
        # is missing, and checks the whitelist the other way round (#347).
        # A fork's PR gets no secrets, so it lands on that refusal — #434.
        run: python3 scripts/ci-check-citability.py

      - name: Types (astro check)
        if: needs.scope.outputs.site == 'true'
        run: |
          npx astro check 2>&1 | tee /tmp/astro-check.log
          grep -q "^- 0 errors" /tmp/astro-check.log
          grep -q "^- 0 warnings" /tmp/astro-check.log

      - name: Seed schema validation
        if: needs.scope.outputs.site == 'true'
        run: npx emdash seed seed/seed.json --validate

      - name: CMS text integrity (labels resolve, no hardcoded copy)
        if: needs.scope.outputs.site == 'true'
        run: python3 scripts/ci-check-cms-text.py

      - name: Locale field parity (a field filled in one locale is filled in both)
        if: needs.scope.outputs.site == 'true'
        # ci-check-cms-text.py above enforces key parity for ui_labels_*, which
        # is the UI chrome. This is the content entries: #468 added `url` to the
        # partners collection, filled it on ES, and left EN without it — the ES
        # page linked the partner while the EN page rendered an em dash, and no
        # gate here saw it for a month (#489).
        run: python3 scripts/ci-check-locale-parity.py

      - name: Cited files exist (every file the site cites is tracked)
        # #535: /deconstruyendo states how the site is built and cites, for
        # every fact, the file that proves it. A rename that leaves a citation
        # behind sends the reader to GitHub's 404 and changes no rendered word,
        # so neither the copy baseline nor any rendered gate would see it. Runs
        # on every pull request, docs-only included: renaming a cited doc is
        # exactly a docs-only change.
        run: python3 scripts/ci-check-cited-files.py

      - name: Design tokens (colour, radius and shadow live in theme.css)
        if: needs.scope.outputs.site == 'true'
        run: python3 scripts/ci-check-design-tokens.py

      - name: CSS source budget (and the figure the doc prints beside it)
        run: python3 scripts/ci-check-css-budget.py

      - name: Cache hints (cache.set only where it reaches the headers)
        if: needs.scope.outputs.site == 'true'
        run: python3 scripts/ci-check-cache-hints.py

      - name: Unit tests (the silent-failure modules, and the repo's own invariants)
        if: needs.scope.outputs.site == 'true'
        run: npm test

  # ── rendered: the gates that read a rendered page and are not the slow two ──
  rendered:
    needs: scope
    if: needs.scope.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `cache: npm` above caches ~/.npm — the tarballs npm DOWNLOADS. It does
      # not cache node_modules, and `npm ci` deletes node_modules by design and
      # rebuilds it: 823 packages extracted, linked, and their install scripts
      # run. Measured 2026-09-04 on a cache that HIT — 257 MB restored at
      # 74 MB/s, then `added 823 packages in 7m`. The cache removed the
      # download and none of the work, in all eight jobs of the run.
      #
      # `~/.cache/puppeteer` rides along because it is the same function of the
      # same lockfile: puppeteer carries `"hasInstallScript": true`, so the
      # browser every browser-driven gate shares is fetched by `npm ci` — eight
      # times a run since #515 split one job into eight.
      #
      # NO `restore-keys`, deliberately. A near-miss restore from a different
      # lockfile is the hazard this whole step introduces: a node_modules that
      # is present but wrong fails inside a gate, and reads like a code fault.
      # Exact match or full install, nothing in between (#526).
      - name: Restore node_modules and the browser  # not-a-gate: a cache lookup, not a check
        id: deps
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            ~/.cache/puppeteer
          key: deps-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install  # not-a-gate: dependency install, not a check
        # Also the browser: puppeteer is a devDependency, so the copy baseline,
        # var() resolution and the layout invariants all share the one Chrome
        # `npm ci` downloads here. No second browser path (#355).
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build
        run: npx astro build

      # This stack can die under the gates below, and when it does the failure
      # names an innocent route. `wrangler dev` treats an error scoped to ONE
      # in-flight request as fatal and exits, so everything after it fails on
      # ERR_CONNECTION_REFUSED. Upstream and open:
      # cloudflare/workers-sdk#15317, fix still open as #15448 and in no release
      # (latest 4.147.0, 2026-10-02); #15207, merged, only logs the cause.
      #
      # The gate steps below therefore run through `scripts/ci-gate.mjs`, which
      # reboots the stack ONCE PER JOB when — and only when — the stack has
      # stopped answering AND wrangler's debug log names a ProxyController
      # cause, and says so in the job summary. A second death in one job is
      # red. Tracked here as #524.
      - name: Boot seeded local stack
        run: scripts/ci-local-stack.sh 8787

      - name: HTML validation (rendered output, all templates)
        shell: node scripts/ci-gate.mjs bash -e {0}
        run: |
          mkdir -p /tmp/html
          for r in /:home /en:home-en /quienes-somos:about /en/about-us:about-en \
                   /contacto:contact /en/contact:contact-en \
                   /comercio-electronico:cart /integracion-de-sistemas:term \
                   /big-data-cloud-analytics:bq /cdn-waf-seguridad-edge-cloudflare:cf \
                   /desarrollo-greenfield:jd \
                   /deconstruyendo:manual /en/deconstructing:manual-en \
                   /politica-de-privacidad:legal /en/privacy-policy:legal-en \
                   /referencias:refs /en/references:refs-en \
                   /creditos:credits /en/credits:credits-en; do
            url="${r%%:*}"; name="${r##*:}"
            curl -sf "http://localhost:8787$url" -o "/tmp/html/$name.html"
          done
          # The 404 is a template too, and no URL above renders it: every route
          # in that list answers 200 by design. Fetched without `-f`, which
          # treats the 404 status as a transfer failure and would abort the
          # step; both locales, because the page renders its own language.
          curl -s "http://localhost:8787/esta-pagina-no-existe" -o /tmp/html/notfound.html
          curl -s "http://localhost:8787/en/this-page-does-not-exist" -o /tmp/html/notfound-en.html
          npx html-validate --config .htmlvalidate.json /tmp/html/*.html
          echo "html-validate: 0 problems across $(ls /tmp/html | wc -l) templates"

      - name: Rendered copy matches the baseline
        # F3 of #355: a permanent step, not a one-off. A diff here is either a
        # regression or an intentional copy change whose baseline was not
        # re-captured; scripts/copy-baseline.mjs documents which.
        shell: node scripts/ci-gate.mjs bash -e {0}
        run: node scripts/copy-baseline.mjs verify --base-url http://localhost:8787

      - name: Security headers
        shell: node scripts/ci-gate.mjs bash -e {0}
        run: scripts/ci-check-headers.sh http://localhost:8787

      - name: Remote reseed keeps the administrator (rehearsal, no remote)
        # #612. The deploy reseed used to delete every user, passkey and the
        # setup flag, which reopened the CMS setup wizard to anyone (#610). The
        # script now plants an admin in its populated rehearsal and refuses
        # unless that admin survives while the seed's own rows are replaced.
        # Here it runs offline at PR time, so the regression fails before merge
        # instead of on the next deploy.
        shell: node scripts/ci-gate.mjs bash -e {0}
        run: scripts/seed-remote-preview.sh pr-rehearsal --rehearsal-only

      - name: Image URLs (href is a path, transform names a quality)
        # #412. The step above proves the transform ANSWERS; this one reads what
        # was asked for. An absolute /_image href sends the endpoint down its
        # remote branch, which on Workers is a fetch of our own hostname and
        # cannot work (#407) — and localhost is precisely where that looks fine.
        #
        # Same crawl, second rule (#409): a URL with no `q` reaches the IMAGES
        # binding with no quality, and the binding then encodes near-losslessly
        # — four to five times the bytes, and again only in production, where
        # nobody is looking at the size of a 200.
        shell: node scripts/ci-gate.mjs bash -e {0}
        run: python3 scripts/ci-check-image-hrefs.py http://localhost:8787

      - name: Team copy (describes the team, never counts it)
        # #575. The site says who does the work and how, never how many: a
        # count caps the capacity a reader imagines and dates the copy. It came
        # back once through a widget copied onto every page, so this reads the
        # rendered pages — text, meta descriptions, JSON-LD — where a number
        # arrives from any source. The mantra «1 equipo» is a negative control.
        shell: node scripts/ci-gate.mjs bash -e {0}
        run: python3 scripts/ci-check-team-copy.py http://localhost:8787

      - name: Every var() resolves, and the template-fed ones carry a fallback
        # #462. An unresolved `var()` with no fallback does not fall back: it
        # invalidates the whole declaration, and the element loses the property.
        # That is #450 (six mono declarations silently rendering sans) and #460
        # (a filled CTA whose background vanished while its white label did not,
        # on twelve routes). Neither was visible to anything else here:
        # ci-check-design-tokens.py reads CSS as text and never starts a
        # browser, and axe is right that an absent background is not a contrast
        # failure. Runs against the same booted stack as the steps above.
        shell: node scripts/ci-gate.mjs bash -e {0}
        run: node scripts/ci-check-var-resolves.mjs http://localhost:8787

      - name: Rows stay equal, ROWs draw no box, no copy is printed twice, and the footer holds its line and its measure
        # #453. The areas block was six white boxes carrying a full paragraph
        # each: 1695px on a 390px phone, row heights from 214 to 305, and the
        # e-commerce excerpt printed VERBATIM in the hero card and again in its
        # row twenty lines apart. Nothing here could see any of it — the copy
        # baseline froze the duplicate along with everything else, the token
        # scan never opens a browser, and a ragged list is neither illegible
        # nor overflowing, so axe is right to stay quiet. Geometry assertions,
        # not a screenshot diff: a pixel diff over 26 routes would go red on
        # every PR of this redesign, get re-baselined on sight, and become
        # furniture.
        shell: node scripts/ci-gate.mjs bash -e {0}
        run: node scripts/ci-check-layout.mjs http://localhost:8787

      - name: Hero frames (no per-pixel effect re-run per frame, the steady frame under the long-task line)
        # #568. Big Data's Lighthouse score swung 0.70-0.98 on one build: the
        # dusk re-ran blur(3px) on its cut-outs on every animation frame, and
        # Lighthouse charged those frames as blocking time. Lighthouse names
        # the script, never the line, so this drives each opening's frames by
        # hand (fake clock, CPU x4, phone) and counts the effects it sets.
        shell: node scripts/ci-gate.mjs bash -e {0}
        run: node scripts/ci-check-hero-frames.mjs http://localhost:8787

  # ── a11y: 40 % of the old wall clock, alone on a runner ───────────────────
  #
  # This is the new critical path. Sharding ci-check-a11y.mjs itself is the next
  # step and is deliberately not this one: that is a change to the script, and
  # mixing it in here would make a workflow refactor unreviewable.
  a11y:
    needs: scope
    if: needs.scope.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `cache: npm` above caches ~/.npm — the tarballs npm DOWNLOADS. It does
      # not cache node_modules, and `npm ci` deletes node_modules by design and
      # rebuilds it: 823 packages extracted, linked, and their install scripts
      # run. Measured 2026-09-04 on a cache that HIT — 257 MB restored at
      # 74 MB/s, then `added 823 packages in 7m`. The cache removed the
      # download and none of the work, in all eight jobs of the run.
      #
      # `~/.cache/puppeteer` rides along because it is the same function of the
      # same lockfile: puppeteer carries `"hasInstallScript": true`, so the
      # browser every browser-driven gate shares is fetched by `npm ci` — eight
      # times a run since #515 split one job into eight.
      #
      # NO `restore-keys`, deliberately. A near-miss restore from a different
      # lockfile is the hazard this whole step introduces: a node_modules that
      # is present but wrong fails inside a gate, and reads like a code fault.
      # Exact match or full install, nothing in between (#526).
      - name: Restore node_modules and the browser  # not-a-gate: a cache lookup, not a check
        id: deps
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            ~/.cache/puppeteer
          key: deps-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install  # not-a-gate: dependency install, not a check
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build
        run: npx astro build

      # This stack can die under the gates below, and when it does the failure
      # names an innocent route. `wrangler dev` treats an error scoped to ONE
      # in-flight request as fatal and exits, so everything after it fails on
      # ERR_CONNECTION_REFUSED. Upstream and open:
      # cloudflare/workers-sdk#15317, fix still open as #15448 and in no release
      # (latest 4.147.0, 2026-10-02); #15207, merged, only logs the cause.
      #
      # The gate steps below therefore run through `scripts/ci-gate.mjs`, which
      # reboots the stack ONCE PER JOB when — and only when — the stack has
      # stopped answering AND wrangler's debug log names a ProxyController
      # cause, and says so in the job summary. A second death in one job is
      # red. Tracked here as #524.
      - name: Boot seeded local stack
        run: scripts/ci-local-stack.sh 8787

      - name: Accessibility (axe + keyboard + shortcuts + reflow)
        shell: node scripts/ci-gate.mjs bash -e {0}
        run: node scripts/ci-check-a11y.mjs http://localhost:8787

  # ── engines: Safari's engine and Android's Chromium, on their own runner (#583) ──
  #
  # Every other rendered gate runs Puppeteer's Chrome. WebKit on Linux needs
  # system libraries installed with apt on every run (they cannot be cached),
  # so this is a job of its own beside `a11y` rather than more minutes on
  # `rendered`: it runs in parallel and stays off the critical path.
  engines:
    needs: scope
    if: needs.scope.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Restore node_modules and the browser  # not-a-gate: a cache lookup, not a check
        id: deps
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            ~/.cache/puppeteer
          key: deps-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install  # not-a-gate: dependency install, not a check
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci

      # Playwright's browsers are a function of its pinned version, which the
      # lockfile carries. A path of their own, not added to the shared key above:
      # the other jobs save that entry too, without these browsers in it.
      - name: Restore the Playwright browsers  # not-a-gate: a cache lookup, not a check
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      # The browsers come from the cache above; WebKit's system libraries come
      # from apt, which no cache restores. Twice in 30 runs apt stalled after
      # "Reading package lists..." and the job sat until its 20-minute timeout
      # (#631). So the apt half is bounded three ways: apt's own network
      # timeouts; `timeout` run AS ROOT — the apt-get Playwright spawns is
      # root, and an unprivileged `timeout` cannot signal it (measured in
      # ubuntu:24.04: the stalled apt-get outlived the kill holding the dpkg
      # lock, and the retry failed on that lock in under a second); and before
      # the one retry, any surviving apt-get is killed and dpkg recovered.
      - name: Install WebKit and Chromium for Playwright  # not-a-gate: browser and system-library install, not a check
        timeout-minutes: 10
        env:
          PW_BROWSERS: webkit chromium-headless-shell
          APT_LIMIT: 240
        run: |
          # shellcheck disable=SC2086  # PW_BROWSERS is a word list on purpose
          npx playwright install $PW_BROWSERS
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "3";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-bounded >/dev/null
          for attempt in 1 2; do
            rc=0
            # shellcheck disable=SC2086
            sudo env "PATH=$PATH" timeout -k 15 "$APT_LIMIT" npx playwright install-deps $PW_BROWSERS || rc=$?
            [ "$rc" = 0 ] && exit 0
            case "$rc" in
              124|137) echo "::warning::system libraries, attempt $attempt: no answer within ${APT_LIMIT}s" ;;
              *) echo "::warning::system libraries, attempt $attempt: exit $rc" ;;
            esac
            sudo pkill -KILL -x apt-get || true
            sudo dpkg --configure -a || true
          done
          exit 1

      - name: Build
        run: npx astro build

      - name: Boot seeded local stack
        run: scripts/ci-local-stack.sh 8787

      - name: Engines (WebKit · iPhone and Desktop Safari, Chromium · Pixel 7, reduced motion included)
        # #583. The home's tail colour and card height animate `var()` inside
        # @keyframes, checked in Safari's engine only by hand until now; and an
        # Android phone's "Remove animations" showed every opening at rest,
        # which #315 intends. This asserts both, on the real clock, and each
        # profile must first catch a frozen tail and a scene that never starts.
        shell: node scripts/ci-gate.mjs bash -e {0}
        run: node scripts/ci-check-engines.mjs http://localhost:8787

  # ── perf: one runner per URL, same three runs and same assertions ─────────
  perf:
    needs: scope
    if: needs.scope.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Scoped and pinned — the bare `lhci` on npm is a placeholder that exits 0
      # having measured nothing (#305). Declared once: the cache key below and
      # both commands read it, so a bump cannot leave one of them behind.
      LHCI: "@lhci/cli@0.15.1"
    strategy:
      # One URL going red must not cancel the measurement of the other four:
      # the useful output of this job is WHICH page regressed.
      fail-fast: false
      matrix:
        url: ${{ fromJSON(needs.scope.outputs.lighthouse_urls) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `cache: npm` above caches ~/.npm — the tarballs npm DOWNLOADS. It does
      # not cache node_modules, and `npm ci` deletes node_modules by design and
      # rebuilds it: 823 packages extracted, linked, and their install scripts
      # run. Measured 2026-09-04 on a cache that HIT — 257 MB restored at
      # 74 MB/s, then `added 823 packages in 7m`. The cache removed the
      # download and none of the work, in all eight jobs of the run.
      #
      # `~/.cache/puppeteer` rides along because it is the same function of the
      # same lockfile: puppeteer carries `"hasInstallScript": true`, so the
      # browser every browser-driven gate shares is fetched by `npm ci` — eight
      # times a run since #515 split one job into eight.
      #
      # NO `restore-keys`, deliberately. A near-miss restore from a different
      # lockfile is the hazard this whole step introduces: a node_modules that
      # is present but wrong fails inside a gate, and reads like a code fault.
      # Exact match or full install, nothing in between (#526).
      - name: Restore node_modules and the browser  # not-a-gate: a cache lookup, not a check
        id: deps
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            ~/.cache/puppeteer
          key: deps-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install  # not-a-gate: dependency install, not a check
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build
        run: npx astro build

      # This stack can die under the gates below, and when it does the failure
      # names an innocent route. `wrangler dev` treats an error scoped to ONE
      # in-flight request as fatal and exits, so everything after it fails on
      # ERR_CONNECTION_REFUSED. Upstream and open:
      # cloudflare/workers-sdk#15317, fix still open as #15448 and in no release
      # (latest 4.147.0, 2026-10-02); #15207, merged, only logs the cause.
      #
      # Lighthouse runs through `scripts/ci-gate.mjs` too, like the gates of
      # `rendered` and `a11y`: one reboot per job, only for this fault, loudly
      # (#524). Until #540 it was the exception, because the gate was
      # `treosh/lighthouse-ci-action` and the wrapper wraps commands — and the
      # two stack deaths measured after #524 were both here, on /contacto.
      - name: Boot seeded local stack
        run: scripts/ci-local-stack.sh 8787

      # Every shard used to install the CLI from the registry before measuring
      # (~10 s, a fresh install's deprecation warnings in the log): setup-node's
      # npm cache is saved by whichever job misses first, never a perf shard.
      # npx keeps what it installs under ~/.npm/_npx, keyed by the spec (#631).
      - name: Restore the Lighthouse CI CLI  # not-a-gate: a cache lookup, not a check
        uses: actions/cache@v6
        with:
          path: ~/.npm/_npx
          key: lhci-${{ runner.os }}-${{ runner.arch }}-${{ env.LHCI }}

      - name: Shard the Lighthouse config to this URL  # not-a-gate: writes a config, asserts nothing
        # The assertions, the run count and the Chrome flags stay in
        # lighthouserc.json — only `collect.url` narrows. A shard that invented
        # its own thresholds would be a different gate wearing the same name.
        run: |
          jq --arg u "${{ matrix.url }}" '.ci.collect.url = [$u]' lighthouserc.json > lighthouserc.shard.json
          cat lighthouserc.shard.json

      - name: Lighthouse assertions (perf>=95, a11y/bp/seo=100)
        id: lighthouse
        # The two commands treosh/lighthouse-ci-action@v12 ran inside, against
        # the @lhci/cli it pinned (^0.15.1, now `env.LHCI`), so the measurement
        # is the one it took: `collect` reads numberOfRuns from the config
        # exactly as the action did. No report
        # upload, as before (#399): the assertions gate the build and name the
        # failing category in the log, and the record that survives is the
        # summary committed under docs/audits/ (#305).
        shell: node scripts/ci-gate.mjs bash -e {0}
        run: |
          npx -y "$LHCI" collect --config=lighthouserc.shard.json
          npx -y "$LHCI" assert --config=lighthouserc.shard.json

      # What a failure that survived the wrapper above was. A null score with
      # CHROME_INTERSTITIAL_ERROR is a dead stack, not a performance finding
      # (#390, #486); after #540 it means the stack died twice in this job, or
      # would not come back. Adds information and nothing else: it runs only
      # when Lighthouse failed, and changes no exit code. Per shard, because each
      # shard boots its own stack and only that shard's stack can explain its
      # score.
      - name: Was the stack alive when Lighthouse failed?  # not-a-gate: diagnosis, changes no exit code
        if: always() && steps.lighthouse.conclusion == 'failure'
        run: |
          node --input-type=module -e '
            import { stackDiagnosis } from "./scripts/lib/stack-probe.mjs";
            const base = "http://localhost:8787";
            const dead = await stackDiagnosis(base);
            if (dead) {
              console.log(dead);
              console.log("    Lighthouse reports this as CHROME_INTERSTITIAL_ERROR and a null");
              console.log("    score, which is not a performance finding. Re-run before reading");
              console.log("    the numbers.");
            } else {
              console.log(`  → ${base} answers NOW. That does not prove it answered during the`);
              console.log("    run, but it makes a dead stack the less likely explanation — read");
              console.log("    the assertion above as a real one.");
            }
          '

  # ── report: the Summary the four jobs above earned ────────────────────────
  report:
    needs: [scope, static, rendered, a11y, engines, perf]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summary  # not-a-gate: writes the report the gates above produced
        if: always()
        env:
          SITE: ${{ needs.scope.outputs.site }}
          RESULTS: static=${{ needs.static.result }} rendered=${{ needs.rendered.result }} a11y=${{ needs.a11y.result }} engines=${{ needs.engines.result }} perf=${{ needs.perf.result }}
        run: |
          {
            # One row per failable step above, in order. The page at
            # /deconstruyendo counts these steps in its prose and names them
            # one by one in the review panel's chips, so this table is the
            # artifact that claim is checked against — it listed eleven and
            # said "8 routes" for a gate covering ten (#305), and two rows had
            # gone stale by #386.
            #
            # THE COUNT IS NO LONGER KEPT BY THIS COMMENT. #499 measured the
            # drift this comment was supposed to prevent: four gates had been
            # added since the last correction and the public page was wrong by
            # four. tests/unit/gate-count.test.ts now derives the number from
            # the steps in this file — every `- name:` that does not carry a
            # `# not-a-gate:` marker, counted once per DISTINCT name because
            # #515 runs `Build` and `Boot seeded local stack` on three runners
            # — and fails when this heading, this table's length, or the seed
            # disagrees. Add a gate and the test tells you every place the
            # number lives.
            #
            # The row text is still prose for a reader: keep it descriptive,
            # and do not transcribe a count or a file list that something else
            # derives — that is how the two rows in #386 went stale, and the
            # test above checks how many rows there are, not what they say.
            #
            # #497 skips the steps that measure a rendered page on a pull
            # request that cannot reach one. THE CLAIM SURVIVES BECAUSE PUSH
            # TO MAIN IS NOT GATED: ci-scope.sh answers site=true for every
            # event that is not a pull_request, so everything that lands on
            # main has been through all of them. That is not caution, it is
            # the condition that keeps a sentence on the public site true —
            # do not "simplify" it by gating main too.
            echo "## Quality gates — 25 steps that can fail"
            echo ""
            echo "\`$RESULTS\`"
            if [ "$SITE" != "true" ]; then
              echo ""
              echo "> ⏭️ **This pull request changes no file that reaches the"
              echo "> rendered site**, so the steps that measure a rendered"
              echo "> page were skipped (#497). The ones that read file"
              echo "> content ran: gitleaks, citability, cited files and the"
              echo "> CSS source budget — which reads a document, and is why this"
              echo "> is a scope check and not \`paths-ignore\`. Every step"
              echo "> above runs on push to \`main\`, without exception."
              echo ""
            fi
            echo "| Gate | Target |"
            echo "|---|---|"
            echo "| gitleaks | no leaks |"
            echo "| citability | 0 forbidden names, in text and inside documents · every unreadable file accounted for |"
            echo "| astro check | 0 errors, 0 warnings |"
            echo "| seed schema | seed.json validates |"
            echo "| cms-text | labels resolve ES+EN, 0 hardcoded copy |"
            echo "| locale parity | a field filled in one locale is filled in the other |"
            echo "| cited files | every file and repository link the seed cites is tracked |"
            echo "| design tokens | colour, radius, shadow and width from theme.css |"
            echo "| CSS source budget | the stylesheets stay under budget, and the doc that prints the figure agrees |"
            echo "| cache hints | cache.set only where headers still open |"
            echo "| unit tests | every vitest suite in tests/unit |"
            echo "| build | astro build succeeds |"
            echo "| local stack | boots and serves, seeded from seed.json |"
            echo "| html-validate | 0 problems, 21 templates |"
            echo "| rendered copy | every seed route matches its baseline · menu links match the seed |"
            echo "| security headers | full #164 suite |"
            echo "| reseed rehearsal | a planted admin, passkey and setup flag survive the remote refresh; the seed's own rows are replaced |"
            echo "| image hrefs | every /_image href is a path, never a URL |"
            echo "| team copy | no count of people, in text, meta or JSON-LD |"
            echo "| var() resolution | every var() resolves, and the template-fed ones carry a fallback |"
            echo "| layout invariants | rows stay equal, ROWs draw no box, no copy printed twice, the footer holds its line and its measure |"
            echo "| hero frames | no per-pixel effect re-run per frame · the steady frame under 50 ms at CPU ×4 |"
            echo "| a11y | axe sample · keyboard traversal, every route · menu focus trap · WCAG 2.1.4 · reflow 320px · W3C Nu |"
            echo "| engines | WebKit iPhone + Desktop Safari, Chromium Pixel 7: the home's tail and card animate · every opening starts and rests · reduced motion starts at rest, no pause |"
            echo "| Lighthouse | perf >=95 · a11y 100 · bp 100 · seo 100 · one runner per URL |"
          } >> "$GITHUB_STEP_SUMMARY"

      # #592: `report` is the one check main requires. It sees every job, so it is
      # red exactly when one of them is. A job skipped by scope (a docs-only
      # change) is not a failure.
      - name: Verdict  # not-a-gate: turns the results above into the one required check
        if: always()
        env:
          RESULTS: scope=${{ needs.scope.result }} static=${{ needs.static.result }} rendered=${{ needs.rendered.result }} a11y=${{ needs.a11y.result }} engines=${{ needs.engines.result }} perf=${{ needs.perf.result }}
        run: |
          red=0
          for r in $RESULTS; do
            case "${r#*=}" in
              failure|cancelled) echo "::error::${r%%=*}: ${r#*=}"; red=1 ;;
            esac
          done
          exit "$red"
