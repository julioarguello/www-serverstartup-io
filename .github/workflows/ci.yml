name: quality-gates

# The practices audited in phase 2 (issues #157/#158/#159/#164) plus the
# citability policy, enforced on every PR and on main (issue #192).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # gitleaks-action lists the PR's commits

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans history of the push range

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Scope — does this change reach the rendered site?  # not-a-gate: fails open, never refuses a change
        id: scope
        # Not "skip CI for docs". The three steps BELOW that read file content
        # rather than a rendered page — gitleaks, citability and the CSS source
        # budget — are deliberately NOT gated on this, because a document is a
        # file: it can carry a secret, a client name, or the budget figure the
        # budget gate exists to check (#475). A plain `paths-ignore: docs/**`
        # would switch that last one off exactly when it matters (#497).
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci-scope.sh

      - name: Install  # not-a-gate: dependency install, not a check
        if: steps.scope.outputs.site == 'true'
        run: npm ci

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The gate is the scan's exit code, never the upload. Observed on PR
          # #397: "1 commits scanned / no leaks found", then the step died in
          # CreateArtifact because the artifact quota was full (#399) — a red
          # secret scan on a clean tree, which is the one lie a security gate
          # must never tell. Nothing consumed those 236 SARIFs: they were never
          # fed to code scanning, and no one downloaded one.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: Citability guard
        env:
          FORBIDDEN_NAMES: ${{ secrets.FORBIDDEN_NAMES }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        # Scans the TRACKED tree for non-citable names, proves it can find
        # one before trusting a clean result, refuses outright if the secret
        # is missing, and checks the whitelist the other way round (#347).
        # A fork's PR gets no secrets, so it lands on that refusal — #434.
        run: python3 scripts/ci-check-citability.py

      - name: Types (astro check)
        if: steps.scope.outputs.site == 'true'
        run: |
          npx astro check 2>&1 | tee /tmp/astro-check.log
          grep -q "^- 0 errors" /tmp/astro-check.log
          grep -q "^- 0 warnings" /tmp/astro-check.log

      - name: Seed schema validation
        if: steps.scope.outputs.site == 'true'
        run: npx emdash seed seed/seed.json --validate

      - name: CMS text integrity (labels resolve, no hardcoded copy)
        if: steps.scope.outputs.site == 'true'
        run: python3 scripts/ci-check-cms-text.py

      - name: Locale field parity (a field filled in one locale is filled in both)
        if: steps.scope.outputs.site == 'true'
        # ci-check-cms-text.py above enforces key parity for ui_labels_*, which
        # is the UI chrome. This is the content entries: #468 added `url` to the
        # partners collection, filled it on ES, and left EN without it — the ES
        # page linked the partner while the EN page rendered an em dash, and no
        # gate here saw it for a month (#489).
        run: python3 scripts/ci-check-locale-parity.py

      - name: Design tokens (colour, radius and shadow live in theme.css)
        if: steps.scope.outputs.site == 'true'
        run: python3 scripts/ci-check-design-tokens.py

      - name: CSS source budget (and the figure the doc prints beside it)
        run: python3 scripts/ci-check-css-budget.py

      - name: Cache hints (cache.set only where it reaches the headers)
        if: steps.scope.outputs.site == 'true'
        run: python3 scripts/ci-check-cache-hints.py

      - name: Unit tests (the silent-failure modules, and the repo's own invariants)
        if: steps.scope.outputs.site == 'true'
        run: npm test

      - name: Build
        if: steps.scope.outputs.site == 'true'
        run: npx astro build

      - name: Boot seeded local stack
        if: steps.scope.outputs.site == 'true'
        run: scripts/ci-local-stack.sh 8787

      - name: HTML validation (rendered output, all templates)
        if: steps.scope.outputs.site == 'true'
        run: |
          mkdir -p /tmp/html
          for r in /:home /en:home-en /quienes-somos:about /en/about-us:about-en \
                   /contacto:contact /en/contact:contact-en \
                   /comercio-electronico:cart /integracion-de-sistemas:term \
                   /big-data-cloud-analytics:bq /cdn-waf-seguridad-edge-cloudflare:cf \
                   /desarrollo-greenfield:jd \
                   /deconstruyendo:manual /en/deconstructing:manual-en \
                   /politica-de-privacidad:legal /en/privacy-policy:legal-en \
                   /referencias:refs /en/references:refs-en; do
            url="${r%%:*}"; name="${r##*:}"
            curl -sf "http://localhost:8787$url" -o "/tmp/html/$name.html"
          done
          # The 404 is a template too, and no URL above renders it: every route
          # in that list answers 200 by design. Fetched without `-f`, which
          # treats the 404 status as a transfer failure and would abort the
          # step; both locales, because the page renders its own language.
          curl -s "http://localhost:8787/esta-pagina-no-existe" -o /tmp/html/notfound.html
          curl -s "http://localhost:8787/en/this-page-does-not-exist" -o /tmp/html/notfound-en.html
          npx --yes html-validate --config .htmlvalidate.json /tmp/html/*.html
          echo "html-validate: 0 problems across $(ls /tmp/html | wc -l) templates"

      - name: Rendered copy matches the baseline
        if: steps.scope.outputs.site == 'true'
        # F3 of #355: a permanent step, not a one-off. Reuses the puppeteer
        # the a11y step already installs — no second browser path. A diff here
        # is either a regression or an intentional copy change whose baseline
        # was not re-captured; scripts/copy-baseline.mjs documents which.
        run: node scripts/copy-baseline.mjs verify --base-url http://localhost:8787

      - name: Security headers
        if: steps.scope.outputs.site == 'true'
        run: scripts/ci-check-headers.sh http://localhost:8787

      - name: Image URLs (href is a path, transform names a quality)
        if: steps.scope.outputs.site == 'true'
        # #412. The step above proves the transform ANSWERS; this one reads what
        # was asked for. An absolute /_image href sends the endpoint down its
        # remote branch, which on Workers is a fetch of our own hostname and
        # cannot work (#407) — and localhost is precisely where that looks fine.
        #
        # Same crawl, second rule (#409): a URL with no `q` reaches the IMAGES
        # binding with no quality, and the binding then encodes near-losslessly
        # — four to five times the bytes, and again only in production, where
        # nobody is looking at the size of a 200.
        run: python3 scripts/ci-check-image-hrefs.py http://localhost:8787

      - name: Every var() resolves, and the template-fed ones carry a fallback
        if: steps.scope.outputs.site == 'true'
        # #462. An unresolved `var()` with no fallback does not fall back: it
        # invalidates the whole declaration, and the element loses the property.
        # That is #450 (six mono declarations silently rendering sans) and #460
        # (a filled CTA whose background vanished while its white label did not,
        # on twelve routes). Neither was visible to anything else here:
        # ci-check-design-tokens.py reads CSS as text and never starts a
        # browser, and axe is right that an absent background is not a contrast
        # failure. Runs against the same booted stack as the steps above.
        run: node scripts/ci-check-var-resolves.mjs http://localhost:8787

      - name: Rows stay equal, ROWs draw no box, no copy is printed twice, and the footer holds its line and its measure
        if: steps.scope.outputs.site == 'true'
        # #453. The areas block was six white boxes carrying a full paragraph
        # each: 1695px on a 390px phone, row heights from 214 to 305, and the
        # e-commerce excerpt printed VERBATIM in the hero card and again in its
        # row twenty lines apart. Nothing here could see any of it — the copy
        # baseline froze the duplicate along with everything else, the token
        # scan never opens a browser, and a ragged list is neither illegible
        # nor overflowing, so axe is right to stay quiet. Geometry assertions,
        # not a screenshot diff: a pixel diff over 26 routes would go red on
        # every PR of this redesign, get re-baselined on sight, and become
        # furniture.
        run: node scripts/ci-check-layout.mjs http://localhost:8787

      - name: Accessibility (axe + keyboard + shortcuts + reflow)
        if: steps.scope.outputs.site == 'true'
        run: node scripts/ci-check-a11y.mjs http://localhost:8787

      - name: Lighthouse assertions (perf>=95, a11y/bp/seo=100)
        if: steps.scope.outputs.site == 'true'
        id: lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: lighthouserc.json
          # Off deliberately (#399). The raw reports are ~8.5 MB per run (five
          # URLs x three runs) and the action exposes no retention input, so 219
          # of them filled the repo's artifact quota — and a full quota makes
          # gitleaks-action die uploading its 7 KB SARIF *after* reporting "no
          # leaks found", which reads as a failed secret scan on a clean tree.
          # Nothing read these reports: the assertions gate the build and name
          # the failing category in the log, and the record that survives is the
          # summary committed under docs/audits/ (#305).
          uploadArtifacts: false

      # The four Node gates all call scripts/lib/stack-probe.mjs when they fail,
      # so a stack that died mid-run says so instead of blaming the diff (#390).
      # Lighthouse is a third-party action and cannot, so its version of that
      # failure surfaces as `"score": null` and CHROME_INTERSTITIAL_ERROR — which
      # reads as a performance regression. It happened twice on main on
      # 2026-09-02 (08:21 and 08:53, /deconstruyendo-esta-web and /contacto), both
      # after the wrangler pin of #446, and neither was a performance finding.
      # This step adds information and nothing else: it runs only when Lighthouse
      # itself failed, and changes no exit code.
      - name: Was the stack alive when Lighthouse failed?  # not-a-gate: diagnosis, changes no exit code
        if: always() && steps.lighthouse.conclusion == 'failure'
        run: |
          node --input-type=module -e '
            import { stackDiagnosis } from "./scripts/lib/stack-probe.mjs";
            const base = "http://localhost:8787";
            const dead = await stackDiagnosis(base);
            if (dead) {
              console.log(dead);
              console.log("    Lighthouse reports this as CHROME_INTERSTITIAL_ERROR and a null");
              console.log("    score, which is not a performance finding. Re-run before reading");
              console.log("    the numbers.");
            } else {
              console.log(`  → ${base} answers NOW. That does not prove it answered during the`);
              console.log("    run, but it makes a dead stack the less likely explanation — read");
              console.log("    the assertion above as a real one.");
            }
          '

      - name: Summary  # not-a-gate: writes the report the gates above produced
        if: always()
        run: |
          {
            # One row per failable step above, in order. The page at
            # /deconstruyendo counts these steps in its prose and names them
            # one by one in the review panel's chips, so this table is the
            # artifact that claim is checked against — it listed eleven and
            # said "8 routes" for a gate covering ten (#305), and two rows had
            # gone stale by #386.
            #
            # THE COUNT IS NO LONGER KEPT BY THIS COMMENT. #499 measured the
            # drift this comment was supposed to prevent: four gates had been
            # added since the last correction and the public page was wrong by
            # four. tests/unit/gate-count.test.ts now derives the number from
            # the steps in this file — every `- name:` that does not carry a
            # `# not-a-gate:` marker — and fails when this heading, this
            # table's length, or the seed disagrees. Add a gate and the test
            # tells you every place the number lives.
            #
            # The row text is still prose for a reader: keep it descriptive,
            # and do not transcribe a count or a file list that something else
            # derives — that is how the two rows in #386 went stale, and the
            # test above checks how many rows there are, not what they say.
            #
            # #497 skips the steps that measure a rendered page on a pull
            # request that cannot reach one. THE CLAIM SURVIVES BECAUSE PUSH
            # TO MAIN IS NOT GATED: ci-scope.sh answers site=true for every
            # event that is not a pull_request, so everything that lands on
            # main has been through all of them. That is not caution, it is
            # the condition that keeps a sentence on the public site true —
            # do not "simplify" it by gating main too.
            echo "## Quality gates — 20 steps that can fail"
            if [ "${{ steps.scope.outputs.site }}" != "true" ]; then
              echo ""
              echo "> ⏭️ **This pull request changes no file that reaches the"
              echo "> rendered site**, so the steps that measure a rendered"
              echo "> page were skipped (#497). The ones that read file"
              echo "> content ran: gitleaks, citability, and the CSS source"
              echo "> budget — which reads a document, and is the reason this"
              echo "> is a scope check and not \`paths-ignore\`. Every step"
              echo "> above runs on push to \`main\`, without exception."
              echo ""
            fi
            echo "| Gate | Target |"
            echo "|---|---|"
            echo "| gitleaks | no leaks |"
            echo "| citability | 0 forbidden names, in text and inside documents · every unreadable file accounted for |"
            echo "| astro check | 0 errors, 0 warnings |"
            echo "| seed schema | seed.json validates |"
            echo "| cms-text | labels resolve ES+EN, 0 hardcoded copy |"
            echo "| locale parity | a field filled in one locale is filled in the other |"
            echo "| design tokens | colour, radius, shadow and width from theme.css |"
            echo "| CSS source budget | the stylesheets stay under budget, and the doc that prints the figure agrees |"
            echo "| cache hints | cache.set only where headers still open |"
            echo "| unit tests | every vitest suite in tests/unit |"
            echo "| build | astro build succeeds |"
            echo "| local stack | boots and serves, seeded from seed.json |"
            echo "| html-validate | 0 problems, 19 templates |"
            echo "| rendered copy | every seed route matches its baseline · menu links match the seed |"
            echo "| security headers | full #164 suite |"
            echo "| image hrefs | every /_image href is a path, never a URL |"
            echo "| var() resolution | every var() resolves, and the template-fed ones carry a fallback |"
            echo "| layout invariants | rows stay equal, ROWs draw no box, no copy printed twice, the footer holds its line and its measure |"
            echo "| a11y | axe sample · keyboard traversal, every route · menu focus trap · WCAG 2.1.4 · reflow 320px · W3C Nu |"
            echo "| Lighthouse | perf >=95 · a11y 100 · bp 100 · seo 100 |"
          } >> "$GITHUB_STEP_SUMMARY"
