name: deploy-production

# "Otra forma para desplegar en prod" (#194): production only ever deploys
# when Julio dispatches this workflow by hand. GitHub environment
# required-reviewers is a paid feature on private repos (HTTP 422), so the
# manual dispatch IS the approval gate — there is no automatic path here.
#
# Same-artifact promotion is impossible with the Cloudflare adapter: bindings
# are flattened into the build at build time (preview and production carry
# different D1/R2/KV ids), so promotion means rebuilding the SAME commit with
# CLOUDFLARE_ENV=production — pin the ref you verified on preview.
on:
  workflow_dispatch:
    inputs:
      seed_d1:
        description: "DESTRUCTIVE — overwrite the production D1 from seed/seed.json. Refused automatically if production already holds content (#358)"
        required: false
        default: false
        type: boolean
      seed_d1_confirm:
        description: "Only to overwrite a production database that ALREADY HOLDS CONTENT. Type exactly: OVERWRITE PRODUCTION CONTENT"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-production
  cancel-in-progress: false # never kill a deploy mid-flight (mixed-state rule)

env:
  PRODUCTION_URL: https://www-serverstartup-io.serverstartup-s-partner-demo-account3612.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ env.PRODUCTION_URL }}
    outputs:
      deployed: ${{ steps.gate.outputs.deployed }}
      production_url: ${{ env.PRODUCTION_URL }}
    steps:
      - name: Gate on CLOUDFLARE_API_TOKEN
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "::error::CLOUDFLARE_API_TOKEN secret not set — cannot deploy production"
            exit 1
          fi
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (production environment)
        # The Cloudflare adapter flattens the wrangler env at BUILD time —
        # this is where production bindings are chosen, not at deploy.
        run: CLOUDFLARE_ENV=production npx astro build

      - name: Guard — refuse to wipe a production D1 that holds content
        if: inputs.seed_d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d70cd71aecc76f94c73d7a6f3cc1265d
          # Through env, never interpolated into the run: body. This job holds
          # CLOUDFLARE_API_TOKEN, and a quote in the typed value would break the
          # shell — a crafted one would run in it.
          SEED_D1_CONFIRM: ${{ inputs.seed_d1_confirm }}
        # The machine condition "pre-launch only" used to be prose in the
        # input description above (#358). Prints the per-table counts —
        # the record, taken before anything is written — and refuses unless
        # the database is empty or the operator typed the confirmation.
        run: scripts/ci-guard-prod-seed.sh www-serverstartup-io "$SEED_D1_CONFIRM"

      # The worker deploys BEFORE the D1 refresh, not after. This is the order
      # deploy-preview.yml already learned the hard way, and production shipped
      # without it: EmDash applies its migrations lazily in the request path
      # under _emdash_migrations_lock, so only the NEW worker can bring the
      # remote schema forward, and the refresh writes rows in the new shape.
      # Preview measured the other order dying with "_emdash_collections has 17
      # columns but 23 values were supplied" (2026-08-22). Production is worse
      # off than preview was: on its first dispatch the remote sat 39
      # migrations behind (30 applied, local canonical 69), so not one ec_*
      # collection table existed for the refresh to write into (#162).
      - name: Deploy production worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: d70cd71aecc76f94c73d7a6f3cc1265d
          command: deploy

      - name: Build local canonical D1 (defines the migration target)
        if: inputs.seed_d1
        id: canonical
        # ci-local-stack seeds a fresh local sqlite the canonical way (emdash
        # applies its migrations). Its _emdash_migrations count IS the target
        # the remote must reach — derived, never hardcoded.
        run: |
          scripts/ci-local-stack.sh 8787
          lsof -ti :8787 | xargs kill -9 2>/dev/null || true
          D1_DB=$(find .wrangler -name "*.sqlite" -path "*/d1/*" -not -name "metadata.sqlite" | head -1)
          TARGET=$(sqlite3 "$D1_DB" "SELECT count(*) FROM _emdash_migrations;")
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "local canonical DB has $TARGET applied migrations"

      - name: Wait until the worker migrates the remote D1
        if: inputs.seed_d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d70cd71aecc76f94c73d7a6f3cc1265d
        # Anonymous page requests can take a cached-binding shortcut, so poke
        # /_emdash/admin (guaranteed runtime init) and poll the REAL condition:
        # the remote _emdash_migrations count reaching the canonical target.
        # Gating on HTTP 200 of "/" is not equivalent — preview shipped that
        # first and it passed while the schema stayed old (run 32586774068).
        run: |
          TARGET=${{ steps.canonical.outputs.target }}
          for i in $(seq 1 36); do
            curl -s -o /dev/null -m 15 "$PRODUCTION_URL/_emdash/admin" || true
            COUNT=$(npx wrangler d1 execute www-serverstartup-io --remote --json \
              --command "SELECT count(*) AS c FROM _emdash_migrations;" 2>/dev/null \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s)[0].results[0].c)}catch{console.log(-1)}})")
            echo "attempt $i: remote applied=$COUNT target=$TARGET (poked /_emdash/admin from the GitHub runner; count via wrangler d1 API)"
            if [ "$COUNT" -ge "$TARGET" ] 2>/dev/null; then exit 0; fi
            sleep 10
          done
          echo "::error::remote D1 never reached $TARGET applied migrations — the worker is not migrating; refusing to seed onto a stale schema"
          exit 1

      - name: Seed production D1 from seed/seed.json (opt-in, destructive)
        if: inputs.seed_d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d70cd71aecc76f94c73d7a6f3cc1265d
        # The local stack was already built by the canonical step above.
        run: |
          scripts/seed-remote-preview.sh www-serverstartup-io

      - name: Summary
        if: always()
        run: |
          {
            echo "## deploy-production"
            echo "Ref: \`${{ github.sha }}\`"
            echo ""
            echo "🏭 ${{ env.PRODUCTION_URL }}"
            if [ "${{ inputs.seed_d1 }}" = "true" ]; then
              echo ""
              echo "⚠️ Production D1 was re-seeded from seed/seed.json."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true'
    uses: ./.github/workflows/verify-deploy.yml
    with:
      base_url: ${{ needs.deploy.outputs.production_url }}
