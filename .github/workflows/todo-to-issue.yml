name: track-tech-debt

# The reader for the inline debt vocabulary of docs/rules/dev-tech-debt.md §1
# (#396): the three scoped debt markers become labelled issues, and the
# issue closes again when the marker leaves the code. Until this existed,
# /dev-review §7 wrote markers that nothing ever read.
#
# main only. On a feature branch the action re-scans every WIP commit and opens
# a duplicate issue for the same marker (dev-tech-debt.md §3).
#
# The `if: github.repository ==` gate below outlived its reason. It was there
# because this file travelled with the public mirror and had to stay inert on
# it; #428 archived the mirror and there is one repository now. Kept anyway: it
# costs nothing, and it is exactly the guard a fork would need.
on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: track-tech-debt
  cancel-in-progress: false # a cancelled run silently drops the markers it carried

jobs:
  todo-to-issue:
    if: github.repository == 'julioarguello/www-serverstartup-io'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Markers → issues
        uses: alstr/todo-to-issue-action@v5
        with:
          # Defaults to false — without it a marker deleted from the source
          # leaves its issue open forever (dev-tech-debt.md §3).
          CLOSE_ISSUES: true
          # Mirrors the severity table of dev-tech-debt.md §1. Matching is by
          # NAME, so the name is the filter: each identifier carries the
          # "(tech-debt)" scope, and a marker without it files nothing (#620).
          # Configured bare until then, which is how the three issues below got
          # filed from prose. The four labels did not exist in the repo; the
          # action created them on its first run, as documented.
          #
          # What prose can still trip: the scanner reads every comment in the
          # repository, this file included, case-insensitively and wherever the
          # word sits in the line. A comment that spells a marker name followed
          # by the parenthesised scope files an issue titled with the rest of
          # the line. Describe them as this paragraph does, never by example.
          #
          # While the identifiers were bare, ordinary words were enough: this
          # file's own first comment filed #402 and #403, and a Spanish «todo»
          # in docs/design/hero-rotativo/generate.py filed #419 (#620).
          IDENTIFIERS: >
            [{"name": "FIXME(tech-debt)", "labels": ["tech-debt", "priority:medium"]},
             {"name": "TODO(tech-debt)",  "labels": ["tech-debt", "priority:low"]},
             {"name": "HACK(tech-debt)",  "labels": ["tech-debt", "priority:workaround"]}]
